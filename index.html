<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Shopee Hari Ini</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* HEADER */
.header {
    background: #ee4d2d;
    color: white;
    padding: 12px;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
}

/* CONTAINER */
.container {
    max-width: 420px;
    margin: auto;
    padding: 10px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* IMAGE */
.product-img {
    width: 100%;
    border-radius: 10px;
}

/* TITLE */
.title {
    font-size: 18px;
    margin-top: 10px;
    font-weight: bold;
}

/* PRICE */
.price {
    color: #ee4d2d;
    font-size: 22px;
    font-weight: bold;
}

.old-price {
    text-decoration: line-through;
    color: grey;
    font-size: 14px;
}

/* BADGE */
.badge {
    background: red;
    color: white;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
}

/* RATING */
.rating {
    color: orange;
    margin-top: 5px;
}

/* BUTTON */
.btn {
    display: block;
    text-align: center;
    background: #ee4d2d;
    color: white;
    padding: 14px;
    border-radius: 10px;
    margin-top: 15px;
    text-decoration: none;
    font-weight: bold;
}

/* URGENCY */
.urgency {
    color: red;
    margin-top: 8px;
    font-size: 14px;
}

/* POPUP */
.popup {
    position: fixed;
    bottom: 20px;
    left: 15px;
    background: black;
    color: white;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
}
</style>

<script>
// AUTO REDIRECT (6s)
setTimeout(function(){
    window.location.href = "https://s.shopee.com.my/6VK7gMfqhq";
}, 6000);

// FAKE BUYER POPUP
let names = ["Ali", "Aina", "Hafiz", "Siti", "Farid"];
setInterval(function(){
    let popup = document.getElementById("popup");
    let name = names[Math.floor(Math.random()*names.length)];
    popup.innerHTML = name + " dari KL baru beli!";
    popup.style.display = "block";

    setTimeout(()=>{ popup.style.display="none"; },3000);
}, 4000);

// RANDOM VIEW COUNT
window.onload = function(){
    let view = document.getElementById("view");
    let num = Math.floor(Math.random() * 50) + 20;
    view.innerHTML = num + " orang sedang melihat produk ini";
}
</script>

</head>

<body>

<div class="header">Shopee Deal Hari Ini 🔥</div>

<div class="container">

    <div class="card">

        <img class="product-img" src="https://i.imgur.com/yZVFhn2.jpeg">

        <div class="title">🔥 Produk Viral Malaysia 2026</div>

        <div>
            <span class="price">RM19.90</span>
            <span class="old-price">RM49.90</span>
            <span class="badge">-60%</span>
        </div>

        <div class="rating">⭐⭐⭐⭐⭐ (4.9 • 1.2k sold)</div>

        <div id="view" style="margin-top:5px;"></div>

        <div class="urgency">⚠️ Stok hampir habis!</div>

        <a class="btn" href="https://s.shopee.com.my/6VK7gMfqhq">
            👉 Beli Sekarang di Shopee
        </a>

    </div>

</div>

<div class="popup" id="popup"></div>

</body>
</html>
