<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Perfume Viral</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
text-align:center;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:15px;
}

h1{
font-size:20px;
color:#111;
}

.highlight{
color:#e60023;
font-weight:bold;
}

img{
width:100%;
border-radius:12px;
margin-top:10px;
}

.box{
background:#fff3cd;
padding:10px;
border-radius:10px;
margin-top:10px;
font-size:14px;
}

.timer{
font-size:28px;
font-weight:bold;
color:#e60023;
margin:15px 0;
}

.btn{
display:none;
margin-top:10px;
background:#e60023;
color:white;
padding:15px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}
.small{
font-size:12px;
color:#666;
margin-top:10px;
}
</style>

</head>
<body>

<div class="container">

<h1>🚗 Bau Kereta Terus Jadi <span class="highlight">“Luxury Vibe”</span></h1>

<img src="https://imgur.com/a/Ycuf4Id">

<div class="box">
🔥 Ramai Malaysia tengah borong car perfume ni sebab:
<br><br>
✔ Bau tahan lama  
✔ Hilang bau rokok / hapak  
✔ Nampak kereta lebih premium  
</div>

<div class="timer">
⏳ Redirect dalam <span id="count">5</span> saat
</div>

<a id="btn" class="btn" href="https://s.shopee.com.my/7fVzwe1248">
👉 BUKA SHOPEE SEKARANG
</a>

<div class="small">
Sedang bawa anda ke Shopee official seller...
</div>

</div>

<script>
let count = 5;
let timer = document.getElementById("count");
let btn = document.getElementById("btn");

let x = setInterval(function(){
count--;
timer.textContent = count;

if(count <= 0){
clearInterval(x);
btn.style.display = "block";

// AUTO REDIRECT KE SHOPEE
window.location.href = "https://s.shopee.com.my/7fVzwe1248";
}

},1000);
</script>

</body>
</html>
